name: Publish UI to GitHub Pages

# ينشر src/Index.html على https://osamamaklad-bit.github.io/qpo-accounting-app/
# إعداد مرة واحدة: Settings > Pages > Source = GitHub Actions
on:
  push:
    branches: [main]
    paths: ['src/Index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp src/Index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
