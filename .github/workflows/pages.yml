name: Sync UI for GitHub Pages

# GitHub Pages بيتنشر من جذر فرع main، فبننسخ src/Index.html لـ index.html في الجذر.
# الرابط: https://osamamaklad-bit.github.io/qpo-accounting-app/
on:
  push:
    branches: [main]
    paths: ['src/Index.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Copy src/Index.html to index.html
        run: |
          cp src/Index.html index.html
          if git diff --quiet -- index.html; then echo "Already in sync"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync index.html from src/Index.html"
          git push
