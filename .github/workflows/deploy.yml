name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      # Web app deployment id (the part between /s/ and /exec in the web app URL)
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID || 'AKfycby5qiOh4iZ902dce7d7sPaKOmZy3pH92fCqL6mDwAfnPtIIC3ZjRDUlFCVsMhALMTUv' }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::warning::Add repository secrets CLASPRC_JSON and SCRIPT_ID to enable deploys."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Push code and update the web app deployment
        if: steps.check.outputs.ok == 'true'
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json
          clasp push -f
          clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"
