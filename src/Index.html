<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetFriend • QBO</title>
<link rel="icon" href="https://osamamaklad-bit.github.io/qpo-accounting-app/icons/favicon-32.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PF QBO">
<link rel="apple-touch-icon" href="https://osamamaklad-bit.github.io/qpo-accounting-app/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* PetFriend brand kit (Canva): peach #FFEEE6 · red #E3041C · navy #1B294D (banners) · cyan #8EF5FC (accent)
   Rounded bold display (Baloo Bhaijaan 2) echoes the bubbly PET FRIEND wordmark; IBM Plex Sans Arabic covers AR + EN body. */
:root{
  --peach:#ffeee6; --peach-2:#ffe2d6; --red:#e3041c; --red-dark:#b80316; --red-soft:#fde3e4;
  --navy:#1b294d; --navy-2:#2c3d6b; --ink:#1b294d; --mute:#6b6f86; --line:rgba(27,41,77,.10);
  --cyan:#8ef5fc; --cyan-soft:#e3fcfe; --cyan-ink:#06717a;
  /* QuickBooks green: everything that writes to QuickBooks Online uses it, PetFriend red stays the brand */
  --qb:#2ca01c; --qb-dark:#108000; --qb-soft:#e8f6e6;
  --ok:#17803d; --ok-soft:#e5f6ea; --warn:#a85d00; --warn-soft:#fff2db;
  --surface:#ffffff; --radius:18px;
  --shadow:0 1px 2px rgba(27,41,77,.06),0 10px 28px rgba(27,41,77,.07);
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);background:var(--peach);color:var(--ink);font-size:14.5px;line-height:1.6}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}

/* buttons */
button{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:8px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--navy);transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:hover{border-color:var(--navy-2)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px rgba(227,4,28,.22)}
button.pri:hover{background:var(--red-dark);border-color:var(--red-dark)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:rgba(27,41,77,.06)}
button.sm{padding:6px 13px;font-size:13px}
button.danger{color:var(--red);border-color:rgba(227,4,28,.35)}
button.danger:hover{background:var(--red-soft);border-color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

input,select,textarea{font:inherit;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2);outline:none;box-shadow:0 0 0 3px var(--cyan-soft)}
textarea{min-height:110px;direction:ltr;text-align:left}
.mono{font-family:var(--f-mono);font-size:12.5px;direction:ltr;text-align:left}

/* login */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:34px 30px 28px;width:min(400px,100%);display:grid;gap:14px;text-align:center}
.login img{width:96px;height:96px;object-fit:contain;margin:0 auto}
.wordmark{font-family:var(--f-display);font-weight:800;color:var(--red);font-size:30px;letter-spacing:.02em;line-height:1}
.wordmark small{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--qb);border-radius:8px;padding:2px 8px;margin-inline-start:8px;vertical-align:middle;letter-spacing:.04em;font-family:var(--f-body)}
.cobrand{display:inline-flex;align-items:center;gap:8px;justify-self:center;font-size:12.5px;font-weight:600;color:var(--qb-dark);background:var(--qb-soft);border-radius:999px;padding:4px 12px}
.cobrand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--qb)}
.duo{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0 50%,var(--qb) 50% 100%)}
[dir=rtl] .duo{background:linear-gradient(270deg,var(--red) 0 50%,var(--qb) 50% 100%)}
button.qbpost{border-color:rgba(44,160,28,.45);color:var(--qb-dark)}
button.qbpost:hover{background:var(--qb-soft);border-color:var(--qb)}
button.pri.qbpost{background:var(--qb);border-color:var(--qb);color:#fff;box-shadow:0 6px 16px rgba(44,160,28,.25)}
button.pri.qbpost:hover{background:var(--qb-dark);border-color:var(--qb-dark)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
footer{max-width:1240px;margin:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));color:var(--mute);font-size:11.5px}
.tag{color:var(--mute);font-size:13px}
.err{color:var(--red);font-size:13px;font-weight:600;word-break:break-word}
.login .lang{justify-self:center}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
.bar{max-width:1240px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand .wordmark{font-size:22px}
nav{display:flex;gap:4px;background:var(--peach);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
nav button{border:none;background:transparent;padding:7px 16px;white-space:nowrap;color:var(--mute)}
nav button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(27,41,77,.12)}
.spacer{flex:1}

main{max-width:1240px;margin:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px}
.section-h{display:flex;align-items:center;gap:10px;font-size:19px;color:var(--navy);margin-top:6px}
.section-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;display:grid;gap:2px}
.tile .n{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--mute);font-size:12.5px;font-weight:500}
.tile.bad .n{color:var(--red)}
.tile.date .n{font-size:22px;padding-top:4px}

/* health */
.health{display:grid;gap:10px}
.health-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.health-h h3{flex:1;font-size:17px;color:var(--navy)}
.hrow{display:grid;grid-template-columns:auto minmax(110px,160px) minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.hrow .nm{font-weight:600}
.hrow .msg{color:var(--mute);font-size:12.5px;word-break:break-word}
.hrow .fix{grid-column:2 / -1;font-size:12.5px;font-weight:600}
.hrow .fix.error{color:var(--red)}
.hrow .fix.warn{color:var(--warn)}
@media(max-width:760px){.hrow{grid-template-columns:auto 1fr}.hrow .msg,.hrow .fix{grid-column:1 / -1}}

/* alert */
.alert{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border-inline-start:6px solid var(--red);padding:14px 18px;display:grid;gap:6px}
.alert h3{font-size:16px;color:var(--red)}
.alert .item{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;cursor:pointer}
.alert .item:hover{background:var(--peach)}
.alert .s{flex-basis:100%;color:var(--mute);font-size:12.5px;word-break:break-word}

/* job cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.card-h{display:flex;align-items:flex-start;gap:10px}
.card-h h3{flex:1;font-size:17px;color:var(--navy)}
.desc{color:var(--mute);font-size:13px}
.last{background:var(--peach);border-radius:14px;padding:10px 12px;font-size:12.5px;display:grid;gap:4px}
.last .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mute)}
.last .s{color:var(--ink);word-break:break-word}
[dir=auto]{unicode-bidi:plaintext;text-align:start}
.k{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.error,.pill.stopped{background:var(--red-soft);color:var(--red)}
.pill.running{background:var(--cyan-soft);color:var(--cyan-ink)}
.pill.none{background:#f1f2f6;color:var(--mute)}
.drytag{background:var(--cyan-soft);color:var(--cyan-ink);border:1px solid var(--cyan);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}

.sched{display:grid;gap:8px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srow label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.srow select{width:auto;padding:6px 10px;border-radius:10px}
/* switch */
.switch{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:#d9dbe4;position:relative;cursor:pointer;flex:none;transition:background .15s;border:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch:checked{background:var(--red)}
.switch:checked::after{inset-inline-start:20px}

.acts{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;border-top:1px dashed var(--line)}
.acts:first-child{border-top:none}
.hook{display:flex;gap:8px}
.hook input{font-size:11.5px}
.badge{font-size:12.5px;color:var(--mute)}
a.badge{color:var(--navy);font-weight:600}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 14px;text-align:start;font-size:13px;vertical-align:top;}
th{font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:#fbf8f6}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--peach)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar select{width:auto;min-width:220px}

/* settings */
.prop{display:grid;grid-template-columns:270px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;}
.prop:last-child{border-bottom:none}
.prop .key{font-family:var(--f-mono);font-size:12.5px;direction:ltr;text-align:left;color:var(--navy-2);word-break:break-all}
.prop .kcell{display:grid;gap:2px;min-width:0}
[dir=rtl] .prop .key{text-align:right}
.prop .hint{font-size:11.5px;color:var(--mute);line-height:1.45}
.prop.changed{box-shadow:inset 4px 0 0 var(--cyan);padding-inline-start:10px}
[dir=rtl] .prop.changed{box-shadow:inset -4px 0 0 var(--cyan)}
.toolbar input[type=search]{width:auto;min-width:200px;flex:1;max-width:340px}
.count{display:inline-block;min-width:20px;border-radius:999px;background:#fff;color:var(--red);font-size:12px;padding:0 6px;margin-inline-start:6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{display:flex;align-items:center;gap:8px}
.row input[type=checkbox]{width:auto;accent-color:var(--red)}

/* payroll */
main > section,#payBody,#logsBody,.tablewrap{min-width:0;max-width:100%}
.paytable{min-width:1300px}
.paytable td{vertical-align:middle;padding:8px 8px}
.paytable input,.paytable select{padding:6px 8px;border-radius:10px;font-size:13px}
.paytable input[type=number]{width:96px}
.paytable select{min-width:96px;padding-inline-end:26px}
.paytable .ded select{min-width:104px}
.paytable .ded{display:flex;gap:4px}
.paytable .ded select{width:auto}.paytable .ded input[type=number]{width:80px}.paytable .ded input[type=text]{width:110px}
.paytable tfoot td{font-weight:700;background:#fbf8f6}
.paytable tr.dirty td{background:var(--cyan-soft)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(27,41,77,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column;padding:20px;gap:8px}
.modal .box .row b{flex:1;font-family:var(--f-display);font-size:17px;color:var(--navy)}
pre{background:var(--navy);color:#e9f0ff;padding:14px;border-radius:14px;overflow:auto;flex:1;white-space:pre-wrap;word-break:break-word;font:12px/1.55 var(--f-mono);direction:ltr;text-align:left;margin:0}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;z-index:30;max-width:min(440px,calc(100% - 36px));box-shadow:0 10px 30px rgba(27,41,77,.3);border-inline-start:5px solid var(--cyan)}

@media(max-width:760px){
  .prop{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .brand .wordmark{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login" class="center hidden">
  <div class="login">
    <img src="https://osamamaklad-bit.github.io/qpo-accounting-app/icons/logo-512.png" alt="PetFriend" onerror="this.remove()">
    <div class="wordmark">PET FRIEND<small>QuickBooks</small></div>
    <div class="tag" data-i="tagline"></div>
    <div class="cobrand" data-i="cobrand"></div>
    <div class="duo"></div>
    <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" class="pri" onclick="doLogin()" data-i="signIn"></button>
    <div id="loginErr" class="err" role="alert"></div>
    <button class="ghost sm lang" onclick="toggleLang()" data-i="otherLang"></button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand">
        <img src="https://osamamaklad-bit.github.io/qpo-accounting-app/icons/logo-512.png" alt="" onerror="this.remove()">
        <div class="wordmark">PET FRIEND<small>QuickBooks</small></div>
      </div>
      <nav>
        <button data-tab="home" onclick="showTab('home')" data-i="tabHome"></button>
        <button data-tab="payroll" onclick="showTab('payroll')" data-i="tabPayroll"></button>
        <button data-tab="logs" onclick="showTab('logs')" data-i="tabLogs"></button>
        <button data-tab="settings" onclick="showTab('settings')" data-i="tabSettings"></button>
        <button data-tab="account" onclick="showTab('account')" data-i="tabAccount"></button>
      </nav>
      <div class="spacer"></div>
      <button id="installBtn" class="sm hidden" onclick="installApp()" data-i="install"></button>
      <button class="ghost sm" onclick="toggleLang()" data-i="otherLang"></button>
      <button class="sm" onclick="logout()" data-i="signOut"></button>
    </div>
    <div class="duo" style="height:3px;border-radius:0"></div>
  </header>

  <main>
    <section id="tab-home"></section>

    <section id="tab-payroll" class="hidden" style="display:grid;gap:16px">
      <div class="toolbar">
        <button class="pri" id="paySaveBtn" onclick="savePayroll()"></button>
        <button onclick="addPayRow()" data-i="payAdd"></button>
        <button onclick="$('payQuick').classList.toggle('hidden')" data-i="payQuickBtn"></button>
        <span id="payInfo" class="badge"></span>
      </div>
      <div id="payWarn"></div>
      <div id="payQuick" class="card hidden">
        <div class="desc" data-i="payQuickDesc"></div>
        <textarea id="payQuickText" style="direction:rtl;text-align:right" placeholder="ايجار ... 2000&#10;راتب ... 5500"></textarea>
        <div class="row"><button class="pri" onclick="quickAddPayroll()" data-i="payQuickAdd"></button></div>
      </div>
      <div id="payBody"></div>
    </section>

    <section id="tab-logs" class="hidden" style="display:grid;gap:16px">
      <div class="toolbar">
        <select id="logJob" onchange="loadLogs()"></select>
        <select id="logStatus" onchange="renderLogRows()" aria-label="status"></select>
        <input id="logSearch" type="search" oninput="renderLogRows()">
        <button class="sm" onclick="loadLogs()" data-i="refresh"></button>
        <a id="logSheet" target="_blank" rel="noopener" class="badge"></a>
      </div>
      <div id="logsBody"></div>
    </section>

    <section id="tab-settings" class="hidden" style="display:grid;gap:18px">
      <div class="toolbar">
        <button class="pri" id="saveBtn" onclick="saveSettings()"></button>
        <button onclick="loadAccounts()" data-i="loadAccounts"></button>
        <button onclick="testConn()" data-i="testConn"></button>
        <span id="connRes" class="badge"></span>
      </div>
      <div id="settingsBody" style="display:grid;gap:18px"></div>

      <h2 class="section-h" data-i="cleanTitle"></h2>
      <div class="card">
        <div class="desc" data-i="cleanDesc"></div>
        <div class="row"><button class="danger" onclick="cleanupProps()" data-i="cleanBtn"></button></div>
        <div id="cleanRes" class="badge"></div>
      </div>

      <h2 class="section-h" data-i="impTitle"></h2>
      <div class="card">
        <div class="desc" data-i="impDesc"></div>
        <textarea id="impText" placeholder='{"QBO_REALM_ID":"..."}  /  https://drive.google.com/file/d/...'></textarea>
        <div class="row"><label><input type="checkbox" id="impOver"> <span data-i="impOver"></span></label>
          <div class="spacer"></div><button class="pri" onclick="importProps()" data-i="impBtn"></button></div>
        <div id="impRes" class="badge"></div>
      </div>
    </section>

    <section id="tab-account" class="hidden">
      <div class="card" style="max-width:460px">
        <h3 data-i="pwTitle"></h3>
        <input id="oldPw" type="password" autocomplete="current-password">
        <input id="newPw" type="password" autocomplete="new-password">
        <input id="newPw2" type="password" autocomplete="new-password">
        <div class="row"><button class="pri" onclick="changePw()" data-i="save"></button></div>
        <div class="desc" data-i="pwNote"></div>
      </div>
    </section>
  </main>
  <footer data-i="tm"></footer>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="box" role="dialog" aria-modal="true">
    <div class="row"><b id="mTitle"></b><button class="sm" onclick="closeModal()" data-i="close"></button></div>
    <div id="mMeta" class="badge"></div>
    <pre id="mLog"></pre>
  </div>
</div>
<div id="toast" class="hidden" role="status"></div>

<script>
/* ---------- اللغة / Language ---------- */
const I18N = {
  ar: {

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
let LANG = lsGet('qboLang') === 'en' ? 'en' : 'ar';
function t(k, ...a){ const v = I18N[LANG][k]; return typeof v === 'function' ? v(...a) : (v == null ? k : v); }
function pick(o, f){ return (LANG === 'en' && o[f + '_en']) ? o[f + '_en'] : o[f]; }

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  $('logSearch').placeholder = t('search');
  const ls = $('logStatus'), cur = ls.value;
  ls.innerHTML = `<option value="">${t('anyStatus')}</option>` + ['error','warn','stopped','running','ok'].map(s => `<option value="${s}">${t(s)}</option>`).join('');
  ls.value = cur;
  if ($('saveBtn')) $('saveBtn').textContent = t('saveChanges');
  $('paySaveBtn').textContent = t('paySave');
  $('pw').placeholder = t('pw'); $('oldPw').placeholder = t('pwOld'); $('newPw').placeholder = t('pwNew'); $('newPw2').placeholder = t('pwNew2');
}
function toggleLang(){
  LANG = LANG === 'ar' ? 'en' : 'ar'; lsSet('qboLang', LANG); applyLang();
  if (!$('app').classList.contains('hidden')){
    if (STATE) renderHome();
    if (SETTINGS) renderSettings();
    if (PAYROLL) renderPayroll();
    $('logJob').innerHTML = '';
    if (!$('tab-logs').classList.contains('hidden')) loadLogs();
  }
}

/* ---------- الأساسيات / Core ---------- */
let TOKEN = null, STATE = null, SETTINGS = null, ACCOUNTS = null, RUNNING = false, LOG_SEQ = 0, PENDING_LOG_JOB = null;
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function toast(msg, ms){ const el=$('toast'); el.textContent=msg; el.classList.remove('hidden'); clearTimeout(el._h); if(ms!==0) el._h=setTimeout(()=>el.classList.add('hidden'), ms||3500); }
function errMsg(e){ return String((e && e.message) || e).replace(/^Error:\s*/,''); }
function st(s){ return ['ok','warn','error','running','stopped'].includes(s) ? t(s) : s; }
function src(s){ return ['manual','schedule','webhook'].includes(s) ? t(s) : s; }
function pill(s){ return `<span class="pill ${esc(s)}">${esc(st(s))}</span>`; }

// جوه Apps Script بنستخدم google.script.run، وبرة (GitHub Pages) بنكلم رابط /exec مباشرة
const API_URL = 'https://script.google.com/macros/s/AKfycby5qiOh4iZ902dce7d7sPaKOmZy3pH92fCqL6mDwAfnPtIIC3ZjRDUlFCVsMhALMTUv/exec?src=ui';
const IN_GAS = !!(window.google && google.script && google.script.run);

function call(fn, ...args){
  const p = IN_GAS
    ? new Promise((res, rej) => { google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); })
    : fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args}) })
        .catch(() => { throw new Error(t('connFail', API_URL.split('?')[0])); })
        .then(r => r.json().catch(() => { throw new Error(t('badReply', r.status)); }))
        .then(d => { if (!d.ok) throw new Error(d.error); return d.result; });
  return p.catch(e => {
    if (errMsg(e) === 'AUTH') showLogin(t('expired'));
    throw e;
  });
}

function showLogin(msg){ TOKEN=null; lsSet('qboTok', null); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginErr').textContent = msg||''; $('pw').focus(); }
async function doLogin(){
  $('loginErr').textContent=''; $('loginBtn').disabled = true;
  try{ TOKEN = await call('api_login', $('pw').value); lsSet('qboTok', TOKEN); $('pw').value=''; start(); }
  catch(e){ $('loginErr').textContent = errMsg(e); }
  finally{ $('loginBtn').disabled = false; }
}
async function logout(){ try{ await call('api_logout', TOKEN);}catch(e){} showLogin(); }
function start(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); showTab('home'); }

function showTab(name){
  const leaving = !$('tab-settings').classList.contains('hidden') && name !== 'settings';
  if (leaving && SETTINGS){ const n = Object.keys(pendingChanges()).length; if (n && !confirm(t('unsavedLeave', n))) return; }
  if (!$('tab-payroll').classList.contains('hidden') && name !== 'payroll' && PAY_DIRTY && !confirm(t('unsavedPay'))) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===name));
  ['home','payroll','logs','settings','account'].forEach(n => $('tab-'+n).classList.toggle('hidden', n!==name));
  if(name==='payroll') loadPayroll();
  if(name==='home') loadHome();
  if(name==='logs') loadLogs();
  if(name==='settings') loadSettings();
}

/* ---------- الرئيسية / Overview ---------- */
async function loadHome(){
  try{ STATE = await call('api_state', TOKEN); renderHome(); }
  catch(e){ if(errMsg(e)!=='AUTH') toast(errMsg(e), 6000); }
}
function hours(sel){ let o=''; for(let h=0;h<24;h++) o+=`<option value="${h}" ${h===sel?'selected':''}>${String(h).padStart(2,'0')}:00</option>`; return o; }

function renderHome(){
  const jobs = STATE.jobs;
  const bad = jobs.filter(j => j.last && ['error','stopped','warn'].includes(j.last.status));
  const activeSched = jobs.reduce((n, j) => n + j.triggers.filter(x => x.enabled).length, 0);
  let h = `<div class="tiles">
    <div class="tile"><span class="n">${jobs.length}</span><span class="l">${t('tScripts')}</span></div>
    <div class="tile"><span class="n">${activeSched}</span><span class="l">${t('tSched')}</span></div>
    <div class="tile ${bad.length?'bad':''}"><span class="n">${bad.length}</span><span class="l">${t('tAttention')}</span></div>
    <div class="tile date"><span class="n mono" style="font-family:var(--f-display)">${esc(STATE.goLive || t('notSet'))}</span><span class="l">${t('tGoLive')}</span></div>
  </div>`;

  h += healthHtml();

  if (bad.length){
    h += `<div class="alert"><h3>${esc(t('alertTitle', bad.length))}</h3>`;
    bad.forEach(j => h += `<div class="item" tabindex="0" onclick="jobLogs('${j.id}')" onkeydown="if(event.key==='Enter')jobLogs('${j.id}')">${pill(j.last.status)} <b>${esc(pick(j,'name'))}</b><span class="badge">${esc(j.last.time)}</span><div class="s" dir="auto">${esc(j.last.summary)}</div></div>`);
    h += `<div class="badge">${t('alertHint')}</div></div>`;
  }

  h += `<div class="legend"><span><i style="background:var(--red)"></i>${t('legendPet')}</span><span><i style="background:var(--qb)"></i>${t('legendQb')}</span></div>`;
  STATE.groups.forEach(g => {
    h += `<h2 class="section-h">${esc(pick(g,'name'))}</h2><div class="grid">`;
    jobs.forEach((j, ji) => {
      if (j.group !== g.id) return;
      const L = j.last;
      h += `<article class="card"><div class="card-h"><h3>${esc(pick(j,'name'))}</h3>${j.dry?`<span class="drytag">${t('dry')}</span>`:''}</div>`;
      h += `<div class="desc">${esc(pick(j,'desc'))}</div>`;
      h += `<div class="last"><span class="k">${t('lastRun')}</span>` + (L
        ? `<div class="meta">${pill(L.status)}<span>${esc(L.time)}</span><span>· ${esc(src(L.source))}</span><span class="mono">· ${esc(L.action)}</span></div><div class="s" dir="auto">${esc(L.summary)}</div>`
        : `<div class="meta"><span class="pill none">${t('none')}</span></div>`) + `</div>`;
      if (j.triggers.length){
        h += `<div class="sched"><span class="k">${t('schedules')}</span>`;
        j.triggers.forEach((tr, ti) => {
          h += `<div class="srow"><label><input type="checkbox" class="switch" id="tg-${ji}-${ti}" ${tr.enabled?'checked':''} onchange="setTrig(${ji},${ti})"> ${esc(pick(tr,'label'))}</label>`;
          h += tr.type==='daily' ? `<select id="th-${ji}-${ti}" onchange="setTrig(${ji},${ti})" aria-label="hour">${hours(tr.hour)}</select>` : `<span class="badge">${t('everyMin', tr.every)}</span>`;
          h += `</div>`;
        });
        h += `</div>`;
      }
      if (j.queue) h += `<div class="badge">${t('oldQueue', j.queue)}</div>`;
      h += `<div class="acts">`;
      j.actions.forEach((a, ai) => h += `<button class="sm ${ai===0?'pri':''} ${a.post && !j.dry?'qbpost':''}" title="${a.post && !j.dry ? esc(t('writesQb')) : ''}" ${RUNNING?'disabled':''} onclick="runAct(${ji},${ai})">${esc(pick(a,'label'))}</button>`);

      if (j.webhook !== null){
        h += `<div><span class="k">${t('hookTitle')}</span>` + (j.webhook
          ? `<div class="hook"><input class="mono" readonly value="${esc(j.webhook)}"><button class="sm" onclick="copyText(${ji})">${t('copy')}</button></div>`
          : `<div class="badge">${t('hookMissing')}</div>`) + `</div>`;
      }
      h += `</article>`;
    });
    h += `</div>`;
  });

  if (STATE.others.length){
    h += `<h2 class="section-h">${t('othersTitle')}</h2><div class="card"><div class="desc">${t('othersDesc')}</div>`;
    STATE.others.forEach(o => h += `<div class="srow"><span class="mono" style="flex:1">${esc(o.fn)} <span class="badge">${esc(o.type)}</span></span><button class="sm danger" onclick="delTrig('${esc(o.id)}')">${t('del')}</button></div>`);
    h += `</div>`;
  }
  $('tab-home').innerHTML = `<div style="display:grid;gap:22px">${h}</div>`;
}

let HEALTH_RUNNING = false;
function healthHtml(){
  const H = STATE.health;
  let h = `<div class="card health"><div class="health-h"><h3>${t('healthTitle')}</h3>` +
    `<span class="badge" id="healthAt">${H ? esc(t('healthAt', H.time)) : ''}</span>` +
    `<button class="sm" id="healthBtn" ${HEALTH_RUNNING?'disabled':''} onclick="runHealth()">${HEALTH_RUNNING ? t('healthChecking') : t('healthRun')}</button></div>`;
  if (!H){ return h + `<div class="badge">${t('healthNever')}</div></div>`; }
  const lab = {ok:t('hOk'), warn:t('hWarn'), error:t('hErr')};
  H.checks.forEach(c => {
    h += `<div class="hrow"><span class="pill ${esc(c.status)}">${esc(lab[c.status]||c.status)}</span><span class="nm">${esc(pick(c,'name'))}</span>` +
      `<span class="msg mono" dir="auto">${esc(c.msg)}</span>` + (pick(c,'fix') ? `<span class="fix ${esc(c.status)}">${esc(pick(c,'fix'))}</span>` : '') + `</div>`;
  });

async function runHealth(){
  if (HEALTH_RUNNING) return;
  HEALTH_RUNNING = true; renderHome();
  try{ STATE.health = await call('api_healthCheck', TOKEN); }
  catch(e){ if (errMsg(e) !== 'AUTH') toast(errMsg(e), 8000); }
  finally{ HEALTH_RUNNING = false; if (STATE) renderHome(); }
}

async function setTrig(ji, ti){
  const j = STATE.jobs[ji], tr = j.triggers[ti];
  const on = $(`tg-${ji}-${ti}`).checked, hr = $(`th-${ji}-${ti}`) ? Number($(`th-${ji}-${ti}`).value) : 0;
  toast(t('saving'), 0);
  try{ STATE = await call('api_setTrigger', TOKEN, tr.fn, on, hr); renderHome(); toast(on ? t('schedOn') : t('schedOff')); }
  catch(e){ toast(errMsg(e), 6000); loadHome(); }
}
async function delTrig(id){
  if(!confirm(t('delTrig'))) return;
  try{ STATE = await call('api_deleteTrigger', TOKEN, id); renderHome(); toast(t('deleted')); }catch(e){ toast(errMsg(e), 6000); }
}
function setActsDisabled(on){ document.querySelectorAll('#tab-home .acts button').forEach(b => b.disabled = on); }

async function runAct(ji, ai){
  if (RUNNING){ toast(t('busy')); return; }
  const j = STATE.jobs[ji], a = j.actions[ai], label = pick(j,'name') + ' ← ' + pick(a,'label');
  if (a.post && j.dry !== true){ if (!confirm(t('postConfirm', label))) return; }
  else if (a.confirm && !confirm(t('confirm', pick(a,'label')))) return;

  RUNNING = true; setActsDisabled(true);
  const t0 = Date.now();
  toast(t('runningToast', pick(a,'label')), 0);
  try{
    const r = await call('api_runAction', TOKEN, j.id, a.fn);
    toast(st(r.status) + ' · ' + r.secs + ' ' + t('secs'));
    openModal(label, `${pill(r.status)} ${esc(r.summary)}`, r.log);
  }catch(e){
    if (errMsg(e) !== 'AUTH') toast(Date.now() - t0 > 300000 ? t('tooLong') : errMsg(e), 12000);
  }finally{
    RUNNING = false;
    loadHome();
  }
}
async function toggleDry(ji){
  const j = STATE.jobs[ji];
  if (j.dry && !confirm(t('dryOffConfirm'))) return;
  const ch = {}; ch[j.dryKey] = j.dry ? 'false' : 'true';
  try{ await call('api_saveSettings', TOKEN, ch); toast(t('done')); loadHome(); }catch(e){ toast(errMsg(e), 6000); }
}
async function copyText(ji){
  const v = STATE.jobs[ji].webhook;
  try{ await navigator.clipboard.writeText(v); toast(t('copied')); return; }catch(e){}
  const ta = document.createElement('textarea'); ta.value=v; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(t('copied')); }catch(e){ toast(t('copyManual')); }
  ta.remove();
}

async function loadLogs(){

  }

  $('logsBody').innerHTML = `<div class="badge">${t('loading')}</div>`;

function propInput(p){
  const id = 'p-' + p.key, o = `data-k="${esc(p.key)}" data-t="${p.type}" data-o="${esc(p.value)}"`;
  if (p.type==='secret') return `<input id="${id}" ${o} type="password" placeholder="${p.set?t('secretSet'):t('secretUnset')}" autocomplete="new-password">`;
  if (p.type==='bool') return `<select id="${id}" ${o}><option value="" ${!p.value?'selected':''}>${t('boolEmpty')}</option><option value="true" ${p.value==='true'?'selected':''}>${t('boolTrue')}</option><option value="false" ${p.value==='false'?'selected':''}>${t('boolFalse')}</option></select>`;
  if (p.type==='account' && ACCOUNTS){
    let opts = `<option value="">—</option>`, found = !p.value;
    ACCOUNTS.forEach(a => { const s = a.id===p.value; if(s) found=true; opts += `<option value="${esc(a.id)}" ${s?'selected':''}>${esc(a.name)} (${esc(a.id)})</option>`; });
    if (!found) opts += `<option value="${esc(p.value)}" selected>${t('notInQbo')}${esc(p.value)}</option>`;
    return `<select id="${id}" ${o}>${opts}</select>`;
  }
  return `<input id="${id}" ${o} value="${esc(p.value)}" ${p.type==='date'?'placeholder="YYYY-MM-DD"':''} class="${/URL|SHOP|ID$|BODY|FIELD|DATE/.test(p.key)?'mono':''}">`;
}

function helpFor(k){ const h = HELP[k]; return h ? h[LANG === 'en' ? 1 : 0] : ''; }

function pendingChanges(){
  const ch = {};
  document.querySelectorAll('#settingsBody [data-k]').forEach(el => {
    const v = el.value.trim();
    if (el.dataset.t==='secret'){ if(v) ch[el.dataset.k]=v; }
    else if (v !== el.dataset.o) ch[el.dataset.k] = v;
  });
  return ch;
}
function updatePending(){
  const ch = pendingChanges(), n = Object.keys(ch).length;
  $('saveBtn').innerHTML = esc(t('saveChanges')) + (n ? `<span class="count">${n}</span>` : '');
  document.querySelectorAll('#settingsBody .prop').forEach(row => {
    const el = row.querySelector('[data-k]'); row.classList.toggle('changed', !!(el && el.dataset.k in ch));
  });
  return n;
}

function propRow(p, canDelete){
  const hint = helpFor(p.key);
  return `<div class="prop"><div class="kcell"><div class="key">${esc(p.key)}</div>${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>${propInput(p)}<div>${canDelete?`<button class="sm danger" onclick="delProp('${esc(p.key)}')">${t('del')}</button>`:(p.set?'':`<span class="badge">${t('empty')}</span>`)}</div></div>`;
}
function renderSettings(){
  let h = '';

  $('settingsBody').innerHTML = h;
  updatePending();
}
async function saveSettings(){

  if (!confirm(t('delConfirm', k))) return;
  const ch = {}; ch[k] = null;
  try{ await call('api_saveSettings', TOKEN, ch); toast(t('deleted')); loadSettings(); }catch(e){ toast(errMsg(e), 6000); }
}
async function loadAccounts(){
  toast(t('loadingAcc'), 0);
  try{ ACCOUNTS = await call('api_qboAccounts', TOKEN); toast(t('accountsN', ACCOUNTS.length)); if (SETTINGS) renderSettings(); }
  catch(e){ toast(errMsg(e), 8000); }
}
async function testConn(){
  $('connRes').textContent = t('testing');
  try{ const r = await call('api_testConnections', TOKEN); $('connRes').textContent = 'QBO: ' + r.qbo + '  |  Shopify: ' + r.shopify; }
  catch(e){ $('connRes').textContent = errMsg(e); }
}
async function cleanupProps(){
  $('cleanRes').textContent = t('checking');
  try{
    const r = await call('api_cleanupProps', TOKEN, false);
    if (!r.keys.length){ $('cleanRes').textContent = t('noUnused'); return; }
    $('cleanRes').innerHTML = esc(t('unused', r.keys.length)) + '<span class="mono">' + esc(r.keys.join(', ')) + '</span>';
    if (!confirm(t('cleanConfirm', r.keys.length, r.keys.join('\n')))) return;
    const d = await call('api_cleanupProps', TOKEN, true);
    $('cleanRes').innerHTML = esc(t('cleaned', d.keys.length)) + '<span class="mono">' + esc(d.keys.join(', ')) + '</span>';
    loadSettings();
  }catch(e){ $('cleanRes').textContent = errMsg(e); }
}
async function importProps(){
  const txt = $('impText').value.trim(); if (!txt) return;
  const over = $('impOver').checked;
  if (!confirm(over ? t('impConfirmOver') : t('impConfirm'))) return;
  try{
    const r = await call('api_importProps', TOKEN, txt, over);
    $('impRes').innerHTML = esc(t('impAdded', r.added)) + (r.overwritten.length ? esc(t('impReplaced')) + `<span class="mono">${esc(r.overwritten.join(', '))}</span>` : '') +
      (r.skipped.length ? `<br>${esc(t('impSkipped'))}<span class="mono">${esc(r.skipped.join(', '))}</span>` : '');
    $('impText').value = ''; loadSettings();
  }catch(e){ $('impRes').textContent = errMsg(e); }
}

/* ---------- الرواتب والإيجارات / Payroll ---------- */
let PAYROLL = null, PAY_DIRTY = false;
const fmt = n => Number(n||0).toLocaleString(LANG === 'en' ? 'en-US' : 'ar-EG', {maximumFractionDigits:2});
async function loadPayroll(){
  $('payBody').innerHTML = `<div class="badge">${t('loading')}</div>`;
  try{ PAYROLL = await call('api_payroll', TOKEN); PAY_DIRTY = false; renderPayroll(); }
  catch(e){ $('payBody').innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; }
}
function opt(v, cur, label){ return `<option value="${v}" ${v===cur?'selected':''}>${esc(label)}</option>`; }
function renderPayroll(){
  const P = PAYROLL, items = P.items;
  $('payInfo').innerHTML = esc(t('payInfo', P.period, items.length)) + (P.dry ? ` <span class="drytag">${t('dry')}</span>` : '');
  $('payWarn').innerHTML = P.missing.length ? `<div class="warnbox">${esc(t('payMissing', P.missing.join(', ')))}</div>` : '';
  let tot = {rent:0, salary:0, net:0};
  let h = `<div class="tablewrap"><table class="paytable"><thead><tr><th>${t('pType')}</th><th>${t('pName')}</th><th>${t('pAmount')}</th><th>${t('pFrom')}</th><th>${t('pRec')}</th><th>${t('pDay')}</th><th>${t('pDed')}</th><th>${t('pAdv')}</th><th>${t('pMonth')}</th><th></th></tr></thead><tbody>`;
  items.forEach((it, i) => {
    const sal = it.type === 'salary', d = it.deduction || {kind:'none', amount:0, note:''};
    let ded = sal && d.kind !== 'none' ? Math.min(d.amount, it.amount) : 0;
    if (sal && d.kind === 'advance') ded = Math.min(ded, it.advanceBalance || 0);
    tot[it.type] += Number(it.amount||0); tot.net += Number(it.amount||0) - ded;
    const paid = P.paid[it.id];
    h += `<tr data-i="${i}">
      <td><select data-f="type">${opt('rent',it.type,t('rent'))}${opt('salary',it.type,t('salary'))}</select></td>
      <td><input data-f="name" value="${esc(it.name)}" style="min-width:150px"></td>
      <td><input data-f="amount" type="number" min="0" step="0.01" value="${esc(it.amount)}"></td>
      <td><select data-f="payFrom">${opt('cash',it.payFrom,t('cash'))}${opt('bank',it.payFrom,t('bank'))}</select></td>
      <td><select data-f="recurrence">${opt('monthly',it.recurrence,t('monthly'))}${opt('manual',it.recurrence,t('manualRec'))}</select></td>
      <td><input data-f="day" type="number" min="1" max="28" value="${esc(it.day)}" style="width:62px" ${it.recurrence==='manual'?'disabled':''}></td>
      <td>${sal ? `<div class="ded"><select data-f="dkind">${opt('none',d.kind,t('dedNone'))}${opt('penalty',d.kind,t('dedPenalty'))}${opt('advance',d.kind,t('dedAdvance'))}</select>
          <input data-f="damount" type="number" min="0" step="0.01" value="${esc(d.amount||0)}" ${d.kind==='none'?'disabled':''}>
          <input data-f="dnote" type="text" placeholder="${t('dedNote')}" value="${esc(d.note||'')}" ${d.kind==='none'?'disabled':''}></div>` : '<span class="badge">—</span>'}</td>
      <td class="num">${sal ? fmt(it.advanceBalance||0) : '—'}</td>
      <td>${paid ? `<span class="pill ok">${t('paid')} · QBO ${esc(paid)}</span>` : `<span class="badge">${it.recurrence==='monthly' ? esc(t('dueOn', it.day)) : t('manualOnly')}</span>`}</td>
      <td><div class="row" style="flex-wrap:nowrap">
        <button class="sm ${P.dry?'':'qbpost'}" ${paid?'disabled':''} onclick="payNow('${esc(it.id)}')">${t('payNow')}</button>
        ${sal ? `<button class="sm" onclick="newAdvance('${esc(it.id)}')">${t('newAdv')}</button>` : ''}
        <button class="sm danger" onclick="delPayRow(${i})" aria-label="${t('del')}">✕</button></div></td></tr>`;
  });
  h += `</tbody><tfoot><tr><td colspan="2">${t('total')}</td><td class="num" colspan="4">${t('rent')}: ${fmt(tot.rent)} · ${t('salary')}: ${fmt(tot.salary)}</td><td colspan="4">${t('net')}: ${fmt(tot.net)}</td></tr></tfoot></table></div>`;
  $('payBody').innerHTML = h;
  setPayDirty(PAY_DIRTY);
}
function setPayDirty(on){ PAY_DIRTY = on; $('paySaveBtn').innerHTML = esc(t('paySave')) + (on ? '<span class="count">•</span>' : ''); }
function collectPayroll(){
  return [...document.querySelectorAll('#payBody tbody tr')].map(tr => {
    const g = f => { const el = tr.querySelector(`[data-f="${f}"]`); return el ? el.value : ''; };
    const base = PAYROLL.items[Number(tr.dataset.i)] || {};
    return { id: base.id || '', type: g('type'), name: g('name').trim(), amount: Number(g('amount')) || 0, payFrom: g('payFrom'),
      recurrence: g('recurrence'), day: Number(g('day')) || 1, advanceBalance: base.advanceBalance || 0,
      deduction: { kind: g('dkind') || 'none', amount: Number(g('damount')) || 0, note: g('dnote') } };
  });
}
$('payBody').addEventListener('input', () => setPayDirty(true));
$('payBody').addEventListener('change', e => {
  setPayDirty(true);
  if (['type','recurrence','dkind'].includes(e.target.dataset.f)){ PAYROLL.items = collectPayroll(); renderPayroll(); }
});
async function savePayroll(){
  try{ PAYROLL = await call('api_payrollSave', TOKEN, collectPayroll()); PAY_DIRTY = false; renderPayroll(); toast(t('savedOk')); }
  catch(e){ toast(errMsg(e), 6000); }
}
function addPayRow(){
  PAYROLL.items = collectPayroll();
  PAYROLL.items.push({id:'', type:'salary', name:'', amount:0, payFrom:'cash', recurrence:'monthly', day:1, advanceBalance:0, deduction:{kind:'none', amount:0, note:''}});
  setPayDirty(true); renderPayroll();
}
function delPayRow(i){
  const items = collectPayroll();
  if (!confirm(t('delRow', items[i].name || '—'))) return;
  items.splice(i, 1); PAYROLL.items = items; setPayDirty(true); renderPayroll();
}
function quickAddPayroll(){
  const digits = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const lines = digits($('payQuickText').value).split(/\n+/).map(s => s.trim()).filter(Boolean);
  const add = [];
  lines.forEach(l => {
    const m = l.match(/^(ا|إ|أ)?يجار|^rent|^راتب|^salary|^مرتب/i); if (!m) return;
    const type = /^(ا|إ|أ)?يجار|^rent/i.test(l) ? 'rent' : 'salary';
    const num = l.match(/([\d.,]+)\s*(ج|جنيه|EGP|LE)?\s*$/i); if (!num) return;
    const amount = Number(num[1].replace(/,/g, '')); if (!(amount > 0)) return;
    const name = l.slice(m[0].length, l.length - num[0].length).replace(/^\s*(ل|لـ|ال)?\s*/, '').trim();
    if (!name) return;
    add.push({id:'', type, name, amount, payFrom:'cash', recurrence:'monthly', day:1, advanceBalance:0, deduction:{kind:'none', amount:0, note:''}});
  });
  if (!add.length){ toast(t('quickNone'), 6000); return; }
  PAYROLL.items = collectPayroll().concat(add); $('payQuickText').value = ''; $('payQuick').classList.add('hidden');
  setPayDirty(true); renderPayroll(); toast(t('quickAdded', add.length), 6000);
}
async function payNow(id){
  if (PAY_DIRTY){ toast(t('payDirty'), 6000); return; }
  if (RUNNING){ toast(t('busy')); return; }
  const it = PAYROLL.items.find(x => x.id === id); if (!it) return;
  if (!confirm(PAYROLL.dry ? t('payConfirmDry', it.name) : t('payConfirm', it.name, fmt(it.amount)))) return;
  RUNNING = true; toast(t('runningToast', it.name), 0);
  try{ const r = await call('api_payrollPay', TOKEN, id); PAYROLL = r.state; renderPayroll();
       toast(st(r.status) + ' · ' + r.secs + ' ' + t('secs')); openModal(it.name, `${pill(r.status)} ${esc(r.summary)}`, r.log); }
  catch(e){ if (errMsg(e) !== 'AUTH') toast(errMsg(e), 8000); }
  finally{ RUNNING = false; }
}
async function newAdvance(id){
  if (PAY_DIRTY){ toast(t('payDirty'), 6000); return; }
  const it = PAYROLL.items.find(x => x.id === id); if (!it) return;
  const v = prompt(t('advPrompt', it.name)); if (v === null) return;
  const amount = Number(String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, ''));
  if (!(amount > 0)) return;
  RUNNING = true; toast(t('runningToast', t('newAdv') + ' ' + it.name), 0);
  try{ const r = await call('api_payrollAdvance', TOKEN, id, amount); PAYROLL = r.state; renderPayroll();
       toast(st(r.status)); openModal(t('newAdv') + ' — ' + it.name, `${pill(r.status)} ${esc(r.summary)}`, r.log); }
  catch(e){ if (errMsg(e) !== 'AUTH') toast(errMsg(e), 8000); }
  finally{ RUNNING = false; }
}

/* ---------- الحساب / Account ---------- */
async function changePw(){
  if ($('newPw').value !== $('newPw2').value){ toast(t('pwMismatch')); return; }
  try{ await call('api_changePassword', TOKEN, $('oldPw').value, $('newPw').value); showLogin(t('pwDone')); }
  catch(e){ toast(errMsg(e), 6000); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('settingsBody').addEventListener('input', updatePending);
$('settingsBody').addEventListener('change', updatePending);
window.addEventListener('beforeunload', e => {
  if ((SETTINGS && !$('tab-settings').classList.contains('hidden') && Object.keys(pendingChanges()).length) || PAY_DIRTY){ e.preventDefault(); e.returnValue = ''; }
});

/* ---------- تطبيق (PWA) / App ---------- */
// بيشتغل بس على GitHub Pages. جوه Apps Script الصفحة في iframe ومينفعش تتثبت.
let INSTALL_PROMPT = null;
if (!IN_GAS && /github\.io$/.test(location.hostname)){
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_PROMPT = e; $('installBtn').classList.remove('hidden'); });
  window.addEventListener('appinstalled', () => { INSTALL_PROMPT = null; $('installBtn').classList.add('hidden'); });
}
async function installApp(){
  if (!INSTALL_PROMPT) return;
  INSTALL_PROMPT.prompt();
  try{ await INSTALL_PROMPT.userChoice; }catch(e){}
  INSTALL_PROMPT = null; $('installBtn').classList.add('hidden');
}

applyLang();
TOKEN = lsGet('qboTok');
if (TOKEN) start(); else showLogin();
</script>
